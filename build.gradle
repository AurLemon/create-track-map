plugins {
    id "java-library"
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "net.neoforged.gradle" version "[6.0.13, 6.2)"
    id "org.jetbrains.kotlin.jvm" version "1.8.10"
    id "org.jetbrains.kotlin.plugin.serialization" version "1.8.10"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

version = mod_version
group = maven_group

var archives_version = "$mod_version+mc$minecraft_version-neoforge"

base {
    archivesName = archives_base_name
}

minecraft {
    mappings("official", minecraft_version)

    runs {
        // applies to all the run configs below
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }

            //runtime "io.ktor:ktor-server-core-jvm:$ktor_version"
            //runtime "io.ktor:ktor-server-cio-jvm:$ktor_version"
            //runtime "io.ktor:ktor-server-cors-jvm:$ktor_version"
            //runtime "org.jetbrains.kotlin-wrappers:kotlin-css-jvm:$kotlin_css_version"
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property('forge.enabledGameTestNamespaces', project.mod_id)
            property("mixin.env.remapRefMap", "true")
            property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")
        }

        server {
            property('forge.enabledGameTestNamespaces', project.mod_id)
            property("mixin.env.remapRefMap", "true")
            property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property('forge.enabledGameTestNamespaces', project.mod_id)
            property("mixin.env.remapRefMap", "true")
            property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")
        }

        data {
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // workingDirectory project.file('run-data')
            property("mixin.env.remapRefMap", "true")
            property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }  // MixinExtras, Fabric ASM
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }  // Reach Entity Attributes
    maven { url = "https://api.modrinth.com/maven" }  // LazyDFU
    maven { url = "https://maven.createmod.net" }  // Create Forge, Flywheel, Ponder
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    maven { url = "https://maven.theillusivec4.top/" }  // Curios
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }
    maven { url = "https://maven.blamejared.com/" }  // JEI
    maven { url = "https://squiddev.cc/maven/" }  // CC: Tweaked
}

dependencies {
    minecraft("net.neoforged:forge:${minecraft_version}-${forge_version}")
    implementation("thedarkcolour:kotlinforforge:$forge_kotlin_version")

    shadow("io.ktor:ktor-server-core-jvm:$ktor_version")
    shadow("io.ktor:ktor-server-cio-jvm:$ktor_version")
    shadow("io.ktor:ktor-server-cors-jvm:$ktor_version")
    shadow("org.jetbrains.kotlin-wrappers:kotlin-css-jvm:$kotlin_css_version")

    // included in Kotlin for Forge
    compileOnly("org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlin_json_version")


    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")
}

var targetJavaVersion = 17

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)

jar {
    archiveFileName = "create-track-map-$mod_version+mc$minecraft_version-neoforge-slim.jar"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    var javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion.set(JavaLanguageVersion.of(targetJavaVersion))
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            "version" : mod_version,
            "minecraft_version" : minecraft_version,
            "forge_version" : forge_version_major,
            "kff_version" : forge_kotlin_version,
            "create_version" : create_version_short
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

compileKotlin {
    kotlinOptions.jvmTarget = targetJavaVersion.toString()
}

shadowJar {
    archivesBaseName = archives_base_name
    version = archives_version
    setArchiveClassifier("")

    dependencies {
        exclude(dependency("org.jetbrains.kotlin:.*"))
        exclude(dependency("org.jetbrains.kotlinx:kotlinx-coroutines-.*"))
        exclude(dependency("org.slf4j:.*"))
    }
    configurations = [project.configurations.shadow]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    mergeServiceFiles {
        include 'META-INF/services/*'
    }
}

reobf {
    shadowJar {}
}